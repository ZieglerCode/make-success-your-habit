name: webstudio-builder

services:
  db:
    image: postgres:16
    container_name: webstudio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - webstudio_db_data:/var/lib/postgresql/data
      - ./src/apps/builder/e2e/schema/current.sql:/docker-entrypoint-initdb.d/001-webstudio-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - internal

  postgrest:
    image: postgrest/postgrest:v12.2.12
    container_name: webstudio-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER}
      PGRST_SERVER_PORT: 3000
    networks:
      - internal

  builder:
    image: webstudio-builder:pilot
    container_name: webstudio-builder
    build:
      context: ./src
      dockerfile: Dockerfile.selfhost
    command: ["node", "/app/apps/builder/server.selfhost.mjs"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_API_KEY: ""
      AUTH_SECRET: ${AUTH_SECRET}
      DEV_LOGIN: "true"
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_URL: https://${WEBSTUDIO_DOMAIN}
      AUTH_WS_CLIENT_ID: ${AUTH_WS_CLIENT_ID}
      AUTH_WS_CLIENT_SECRET: ${AUTH_WS_CLIENT_SECRET}
      TRPC_SERVER_API_TOKEN: ${TRPC_SERVER_API_TOKEN}
      PUBLISHER_HOST: ${PUBLISHER_HOST}
      FEATURE_FLAGS: "*"
      PLANS: ${PLANS}
      MAX_UPLOAD_SIZE: "25"
    volumes:
      - ./server.selfhost.mjs:/app/apps/builder/server.selfhost.mjs:ro
      - webstudio_assets:/app/apps/builder/public/cgi/asset
      - webstudio_staged_uploads:/app/apps/builder/.webstudio/uploads
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.webstudio-gzip.compress=true
      - traefik.http.middlewares.webstudio-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.webstudio-http.entrypoints=http
      - traefik.http.routers.webstudio-http.middlewares=webstudio-https-redirect
      - traefik.http.routers.webstudio-http.rule=Host(`${WEBSTUDIO_DOMAIN}`)
      - traefik.http.routers.webstudio-http.service=webstudio-builder
      - traefik.http.routers.webstudio-project-http.entrypoints=http
      - traefik.http.routers.webstudio-project-http.middlewares=webstudio-https-redirect
      - 'traefik.http.routers.webstudio-project-http.rule=HostRegexp(`^p-[a-z0-9-]+\.webstudio\.mathishoffmann\.com$`)'
      - traefik.http.routers.webstudio-project-http.service=webstudio-builder
      - traefik.http.routers.webstudio-https.entrypoints=https
      - traefik.http.routers.webstudio-https.middlewares=webstudio-gzip
      - traefik.http.routers.webstudio-https.rule=Host(`${WEBSTUDIO_DOMAIN}`)
      - traefik.http.routers.webstudio-https.service=webstudio-builder
      - traefik.http.routers.webstudio-https.tls=true
      - traefik.http.routers.webstudio-https.tls.certresolver=letsencrypt
      - traefik.http.routers.webstudio-project-https.entrypoints=https
      - traefik.http.routers.webstudio-project-https.middlewares=webstudio-gzip
      - 'traefik.http.routers.webstudio-project-https.rule=HostRegexp(`^p-[a-z0-9-]+\.webstudio\.mathishoffmann\.com$`)'
      - traefik.http.routers.webstudio-project-https.service=webstudio-builder
      - traefik.http.routers.webstudio-project-https.tls=true
      - traefik.http.routers.webstudio-project-https.tls.certresolver=cloudflare
      - traefik.http.routers.webstudio-project-https.tls.domains[0].main=${WEBSTUDIO_DOMAIN}
      - traefik.http.routers.webstudio-project-https.tls.domains[0].sans=*.${WEBSTUDIO_DOMAIN}
      - traefik.http.services.webstudio-builder.loadbalancer.server.port=3000

volumes:
  webstudio_db_data:
    name: webstudio_db_data
  webstudio_assets:
    name: webstudio_assets
  webstudio_staged_uploads:
    name: webstudio_staged_uploads

networks:
  internal:
    name: webstudio_internal
    internal: true
  coolify:
    external: true
    name: coolify
